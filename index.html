<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TiaozinGPT</title>

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="script.js" defer></script>
</head>

<body>

    <div class="app">

        <!-- Menu lateral -->
        <header class="menu">

            <h1 class="logo">Tiaozin<span>GPT</span></h1>

            <div class="campoChave">
                <label class="form-label" for="apiKey">API Key</label>
                <input type="password" id="apiKey" class="form-control" placeholder="Cole sua chave aqui"
                    autocomplete="off">
            </div>

            <button class="btn btnNova" id="btnNovaConversa">
                + Nova conversa
            </button>

            <p class="tituloLista">Conversas</p>

            <ul id="listaConversas" class="listaConversas"></ul>

        </header>

        <!-- Área principal -->
        <main class="principal">

            <!-- Tela inicial -->
            <div class="inicial" id="inicial">

                <div class="inicialConteudo">

                    <div class="areaChat largura">
                        <h2>Como posso ajudar?</h2>
                    </div>

                    <!-- Campo inicial -->
                    <div class="mensagemInicial largura d-flex gap-2">

                        <input type="text" id="mensagemInicial" placeholder="Digite aqui..." class="form-control"
                            autocomplete="off">

                        <button class="btn btn-primary" id="btnEnviarInicial">
                            ➤
                        </button>

                    </div>

                </div>

            </div>

            <!-- Área das conversas -->
            <div class="areaConversa largura" id="areaConversa"></div>

            <!-- Campo inferior -->
            <div class="mensagem largura d-flex gap-2" id="mensagemInferior">

                <input type="text" id="mensagem" placeholder="Digite aqui..." class="form-control" autocomplete="off">

                <button class="btn btn-primary" id="btnEnviar">
                    ➤
                </button>

            </div>

        </main>

    </div>

</body>

</html>
